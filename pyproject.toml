[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arclat-mcp"
version = "0.1.2"
description = "Arclat — AI agent latency auditor as an MCP server"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abdur-Rafay", email = "abdur@lythe.ai" }]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
arclat-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
