[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay-mcp"
version = "0.2.0"
description = "Relay — AI agent latency auditor as an MCP server (an Arclat product)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abdur-Rafay", email = "abdur@lythe.ai" }]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
relay = "mcp_server.cli:main"
relay-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
