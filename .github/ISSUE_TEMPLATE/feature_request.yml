name: Feature request
description: Suggest a new detector, flag, or capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The latency problem
      description: >
        What slow pattern is Relay missing, or what does it make hard today? Describe the
        problem before the solution.
    validations:
      required: true

  - type: textarea
    id: pattern
    attributes:
      label: Example code
      description: If you are proposing a detector, show the pattern it should flag.
      render: python

  - type: textarea
    id: dismissal
    attributes:
      label: When should it be dismissed?
      description: >
        Every detector must be able to explain itself. What is the one-line reason a
        finding of this kind would be a false positive?
      placeholder: "Dismissed when the two awaits share a variable - they are data-dependent."

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
